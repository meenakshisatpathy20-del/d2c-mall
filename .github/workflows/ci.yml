name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx oxlint src api
      - name: Build
        run: npm run build
      - name: API smoke test
        run: node --input-type=module -e "const m = await import('./api/_lib/auth.js'); const h = m.hashPassword('x'); if (!m.verifyPassword('x', h)) process.exit(1); console.log('api ok')"
